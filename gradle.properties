org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
org.gradle.caching=true
org.gradle.java.installations.auto-download=false
kotlin.code.style=official
# One version for every artifact (ADR 0019 decision 1); the release PR sets the release version.
meshlink.version=0.1.0-SNAPSHOT
# iosMain (shared by iosArm64 and iosSimulatorArm64) uses the libsodium cinterop bindings.
kotlin.mpp.enableCInteropCommonization=true
# Off-Mac hosts can't run the libsodium cinterop that :meshlink's iOS klibs need, so they treat iOS
# as unsupported and infer its ABI dump; the macOS CI job checks the real klib dump (ADR 0004).
kotlin.native.enableKlibsCrossCompilation=false
