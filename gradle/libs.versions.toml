[versions]
kotlin = "2.4.21"
agp = "9.3.3"
jdk-toolchain = "21"
android-compileSdk = "37.2"
android-minSdk = "26"
# NDK for libsodium and the JNI shim (ADR 0005); CI installs exactly this version with sdkmanager.
android-ndk = "30.0.16248370"
junit4 = "4.13.2"
kotlinx-coroutines = "1.11.0"
cucumber-kmp = "0.2.1"
kover = "0.9.11"
detekt = "2.0.0-alpha.6"
spotless = "8.12.0"
ktlint = "1.8.0"
dokka = "2.3.0"
skie = "0.10.16"
maven-publish = "0.37.0"
robolectric = "4.18.1"
# The android-all jars Robolectric 4.18 runs for SDK 26 and 37 (its DefaultSdkProvider table); host tests load them offline.
robolectric-sdk26 = "8.0.0_r4-robolectric-r1-i7"
robolectric-sdk37 = "17-robolectric-16653203-i7"
androidx-test-core = "1.7.0"
# The scheduled fuzz task only (ADR 0017 decision 9); never on a test or published classpath.
jazzer = "0.30.0"
# Lab apps only (labapp/, ADR 0005 2026-11-15 lab apps amendment); never in a published artifact.
compose-bom = "2026.11.01"
androidx-activity = "1.13.0"

# Security floors (ADR 0005 2026-11-24 amendment): the lowest version build tooling may resolve for a module it pulls
# in transitively; never a direct dependency. Each is the newest patched release in the line the tooling already uses.
floor-netty = "4.1.141.Final"
floor-jackson = "2.22.4"
floor-guava = "33.8.0-jre"
floor-bouncycastle = "1.87"
floor-freemarker = "2.3.35"
floor-commons-lang3 = "3.22.0"
floor-httpclient = "4.5.14"
floor-jose4j = "0.9.7"
floor-jdom2 = "2.0.6.1"
floor-opentelemetry = "1.68.0"

[libraries]
kotlin-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
android-gradle-plugin = { module = "com.android.tools.build:gradle", version.ref = "agp" }
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
kotlin-test-junit = { module = "org.jetbrains.kotlin:kotlin-test-junit", version.ref = "kotlin" }
cucumber-kmp-core = { module = "io.github.menjoo.cucumberkmp:cucumber-kmp-core", version.ref = "cucumber-kmp" }
junit4 = { module = "junit:junit", version.ref = "junit4" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinx-coroutines" }
kover-gradle-plugin = { module = "org.jetbrains.kotlinx:kover-gradle-plugin", version.ref = "kover" }
detekt-gradle-plugin = { module = "dev.detekt:detekt-gradle-plugin", version.ref = "detekt" }
spotless-gradle-plugin = { module = "com.diffplug.spotless:spotless-plugin-gradle", version.ref = "spotless" }
dokka-gradle-plugin = { module = "org.jetbrains.dokka:dokka-gradle-plugin", version.ref = "dokka" }
skie-gradle-plugin = { module = "co.touchlab.skie:gradle-plugin", version.ref = "skie" }
maven-publish-gradle-plugin = { module = "com.vanniktech:gradle-maven-publish-plugin", version.ref = "maven-publish" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
robolectric-android-all-sdk26 = { module = "org.robolectric:android-all-instrumented", version.ref = "robolectric-sdk26" }
robolectric-android-all-sdk37 = { module = "org.robolectric:android-all-instrumented", version.ref = "robolectric-sdk37" }
androidx-test-core = { module = "androidx.test:core", version.ref = "androidx-test-core" }
jazzer = { module = "com.code-intelligence:jazzer", version.ref = "jazzer" }
jazzer-api = { module = "com.code-intelligence:jazzer-api", version.ref = "jazzer" }
compose-compiler-gradle-plugin = { module = "org.jetbrains.kotlin:compose-compiler-gradle-plugin", version.ref = "kotlin" }
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose-bom" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-material3 = { module = "androidx.compose.material3:material3" }
androidx-activity = { module = "androidx.activity:activity", version.ref = "androidx-activity" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activity" }

floor-netty-codec = { module = "io.netty:netty-codec", version.ref = "floor-netty" }
floor-netty-codec-http = { module = "io.netty:netty-codec-http", version.ref = "floor-netty" }
floor-netty-codec-http2 = { module = "io.netty:netty-codec-http2", version.ref = "floor-netty" }
floor-netty-common = { module = "io.netty:netty-common", version.ref = "floor-netty" }
floor-netty-handler = { module = "io.netty:netty-handler", version.ref = "floor-netty" }
floor-netty-handler-proxy = { module = "io.netty:netty-handler-proxy", version.ref = "floor-netty" }
floor-jackson-core = { module = "com.fasterxml.jackson.core:jackson-core", version.ref = "floor-jackson" }
floor-jackson-databind = { module = "com.fasterxml.jackson.core:jackson-databind", version.ref = "floor-jackson" }
floor-guava = { module = "com.google.guava:guava", version.ref = "floor-guava" }
floor-bcprov = { module = "org.bouncycastle:bcprov-jdk18on", version.ref = "floor-bouncycastle" }
floor-bcpkix = { module = "org.bouncycastle:bcpkix-jdk18on", version.ref = "floor-bouncycastle" }
floor-freemarker = { module = "org.freemarker:freemarker", version.ref = "floor-freemarker" }
floor-commons-lang3 = { module = "org.apache.commons:commons-lang3", version.ref = "floor-commons-lang3" }
floor-httpclient = { module = "org.apache.httpcomponents:httpclient", version.ref = "floor-httpclient" }
floor-jose4j = { module = "org.bitbucket.b_c:jose4j", version.ref = "floor-jose4j" }
floor-jdom2 = { module = "org.jdom:jdom2", version.ref = "floor-jdom2" }
floor-opentelemetry-api = { module = "io.opentelemetry:opentelemetry-api", version.ref = "floor-opentelemetry" }

[plugins]
cucumber-kmp = { id = "io.github.menjoo.cucumberkmp", version.ref = "cucumber-kmp" }
