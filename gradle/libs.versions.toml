[versions]
kotlin = "2.4.21"
agp = "9.3.3"
jdk-toolchain = "21"
android-compileSdk = "37"
android-minSdk = "26"
junit4 = "4.13.2"
kover = "0.9.11"
detekt = "2.0.0-alpha.6"
spotless = "8.11.0"
ktlint = "1.8.0"
dokka = "2.3.0"
robolectric = "4.18"
# The android-all jars Robolectric 4.18 runs for SDK 26 and 37 (its DefaultSdkProvider table); host tests load them offline.
robolectric-sdk26 = "8.0.0_r4-robolectric-r1-i7"
robolectric-sdk37 = "17-robolectric-16653203-i7"
androidx-test-core = "1.7.0"

[libraries]
kotlin-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
android-gradle-plugin = { module = "com.android.tools.build:gradle", version.ref = "agp" }
kotlin-test-junit = { module = "org.jetbrains.kotlin:kotlin-test-junit", version.ref = "kotlin" }
junit4 = { module = "junit:junit", version.ref = "junit4" }
kover-gradle-plugin = { module = "org.jetbrains.kotlinx:kover-gradle-plugin", version.ref = "kover" }
detekt-gradle-plugin = { module = "dev.detekt:detekt-gradle-plugin", version.ref = "detekt" }
spotless-gradle-plugin = { module = "com.diffplug.spotless:spotless-plugin-gradle", version.ref = "spotless" }
dokka-gradle-plugin = { module = "org.jetbrains.dokka:dokka-gradle-plugin", version.ref = "dokka" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
robolectric-android-all-sdk26 = { module = "org.robolectric:android-all-instrumented", version.ref = "robolectric-sdk26" }
robolectric-android-all-sdk37 = { module = "org.robolectric:android-all-instrumented", version.ref = "robolectric-sdk37" }
androidx-test-core = { module = "androidx.test:core", version.ref = "androidx-test-core" }
