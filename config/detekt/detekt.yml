# Builds on detekt's default config (buildUponDefaultConfig). detekt 2.0.0-alpha.6 excludes test code
# from these rules by directory name, but its list predates AGP 9 `androidHostTest` and the KMP
# hierarchy (`appleTest`, `nativeTest`, `iosSimulatorArm64Test`, ...). `**/*Test/**` covers every
# Kotlin source-set test directory; production source sets keep every rule.

comments:
  KDocReferencesNonPublicProperty:
    excludes: ['**/test/**', '**/*Test/**']
  UndocumentedPublicClass:
    excludes: ['**/test/**', '**/*Test/**']
  UndocumentedPublicFunction:
    excludes: ['**/test/**', '**/*Test/**']
  UndocumentedPublicProperty:
    excludes: ['**/test/**', '**/*Test/**']
complexity:
  StringLiteralDuplication:
    excludes: ['**/test/**', '**/*Test/**']
  TooManyFunctions:
    excludes: ['**/test/**', '**/*Test/**']
exceptions:
  InstanceOfCheckForException:
    excludes: ['**/test/**', '**/*Test/**']
  ThrowingExceptionsWithoutMessageOrCause:
    excludes: ['**/test/**', '**/*Test/**']
  TooGenericExceptionCaught:
    excludes: ['**/test/**', '**/*Test/**']
naming:
  FunctionNaming:
    excludes: ['**/test/**', '**/*Test/**']
performance:
  ForEachOnRange:
    excludes: ['**/test/**', '**/*Test/**']
  SpreadOperator:
    excludes: ['**/test/**', '**/*Test/**']
potential-bugs:
  LateinitUsage:
    excludes: ['**/test/**', '**/*Test/**']
  UnsafeCallOnNullableType:
    excludes: ['**/test/**', '**/*Test/**']
style:
  MagicNumber:
    excludes: ['**/test/**', '**/*Test/**']
  # Common code is deterministic: nothing in commonMain reads ambient time or randomness.
  ForbiddenImport:
    active: true
    includes: ['**/commonMain/**']
    excludes: ['**/RandomSource.kt']
    forbiddenImports:
      - value: 'kotlin.random.*'
        reason: 'Draw randomness through RandomSource so one seed replays one run (ADR 0017 decision 3).'
      - value: 'kotlin.time.Clock'
        reason: 'Read time through Clock so tests run in virtual time (ADR 0017 decision 2).'
      - value: 'kotlin.time.TimeSource*'
        reason: 'Read time through Clock so tests run in virtual time (ADR 0017 decision 2).'
  ForbiddenMethodCall:
    active: true
    includes: ['**/commonMain/**']
    methods:
      - value: 'kotlin.io.print'
        reason: 'print does not allow you to configure the output stream.'
      - value: 'kotlin.io.println'
        reason: 'println does not allow you to configure the output stream.'
      - value: 'kotlin.system.measureTimeMillis'
        reason: 'Read time through Clock so tests run in virtual time (ADR 0017 decision 2).'
      - value: 'kotlin.random.Random.Default.nextBits'
        reason: 'Draw randomness through RandomSource so one seed replays one run (ADR 0017 decision 3).'
      - value: 'kotlin.random.Random.Default.nextBoolean'
        reason: 'Draw randomness through RandomSource so one seed replays one run (ADR 0017 decision 3).'
      - value: 'kotlin.random.Random.Default.nextBytes'
        reason: 'Draw randomness through RandomSource so one seed replays one run (ADR 0017 decision 3).'
      - value: 'kotlin.random.Random.Default.nextDouble'
        reason: 'Draw randomness through RandomSource so one seed replays one run (ADR 0017 decision 3).'
      - value: 'kotlin.random.Random.Default.nextFloat'
        reason: 'Draw randomness through RandomSource so one seed replays one run (ADR 0017 decision 3).'
      - value: 'kotlin.random.Random.Default.nextInt'
        reason: 'Draw randomness through RandomSource so one seed replays one run (ADR 0017 decision 3).'
      - value: 'kotlin.random.Random.Default.nextLong'
        reason: 'Draw randomness through RandomSource so one seed replays one run (ADR 0017 decision 3).'
      - value: 'kotlin.random.nextInt'
        reason: 'Draw randomness through RandomSource so one seed replays one run (ADR 0017 decision 3).'
      - value: 'kotlin.random.nextLong'
        reason: 'Draw randomness through RandomSource so one seed replays one run (ADR 0017 decision 3).'
      - value: 'kotlin.random.nextUInt'
        reason: 'Draw randomness through RandomSource so one seed replays one run (ADR 0017 decision 3).'
      - value: 'kotlin.random.nextULong'
        reason: 'Draw randomness through RandomSource so one seed replays one run (ADR 0017 decision 3).'
      - value: 'kotlin.random.nextUBytes'
        reason: 'Draw randomness through RandomSource so one seed replays one run (ADR 0017 decision 3).'
      - value: 'kotlin.collections.shuffled'
        reason: 'Draw randomness through RandomSource so one seed replays one run (ADR 0017 decision 3).'
      - value: 'kotlin.collections.shuffle'
        reason: 'Draw randomness through RandomSource so one seed replays one run (ADR 0017 decision 3).'
      - value: 'kotlin.collections.random'
        reason: 'Draw randomness through RandomSource so one seed replays one run (ADR 0017 decision 3).'
      - value: 'kotlin.collections.randomOrNull'
        reason: 'Draw randomness through RandomSource so one seed replays one run (ADR 0017 decision 3).'
      - value: 'kotlin.ranges.random'
        reason: 'Draw randomness through RandomSource so one seed replays one run (ADR 0017 decision 3).'
      - value: 'kotlin.ranges.randomOrNull'
        reason: 'Draw randomness through RandomSource so one seed replays one run (ADR 0017 decision 3).'
      - value: 'kotlin.text.random'
        reason: 'Draw randomness through RandomSource so one seed replays one run (ADR 0017 decision 3).'
      - value: 'kotlin.text.randomOrNull'
        reason: 'Draw randomness through RandomSource so one seed replays one run (ADR 0017 decision 3).'
      - value: 'kotlin.uuid.Uuid.Companion.random'
        reason: 'Draw randomness through RandomSource so one seed replays one run (ADR 0017 decision 3).'
      - value: 'kotlin.uuid.Uuid.Companion.generateV4'
        reason: 'Draw randomness through RandomSource so one seed replays one run (ADR 0017 decision 3).'
      - value: 'kotlin.uuid.Uuid.Companion.generateV7'
        reason: 'Draw randomness through RandomSource so one seed replays one run (ADR 0017 decision 3).'
      - value: 'kotlin.time.Clock.System.now'
        reason: 'Read time through Clock so tests run in virtual time (ADR 0017 decision 2).'
      - value: 'kotlin.time.TimeSource.Monotonic.markNow'
        reason: 'Read time through Clock so tests run in virtual time (ADR 0017 decision 2).'
      - value: 'kotlin.time.measureTime'
        reason: 'Read time through Clock so tests run in virtual time (ADR 0017 decision 2).'
      - value: 'kotlin.time.measureTimedValue'
        reason: 'Read time through Clock so tests run in virtual time (ADR 0017 decision 2).'
      - value: 'kotlin.system.measureNanoTime'
        reason: 'Read time through Clock so tests run in virtual time (ADR 0017 decision 2).'
