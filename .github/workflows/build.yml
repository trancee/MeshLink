# Build gates (ADR 0005 "CI", ADR 0017 decisions 12 and 13, ADR 0021 decision 6). Actions and runner
# images are registered in docs/reference/dependencies.md ("CI tools"). No step retries a test.
name: Build

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Gradle check and Dokka (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # checkChangelog diffs against the merge base with origin/main.
          fetch-depth: 0
      # MIT basic provider: caches ~/.gradle/caches (dependencies, Robolectric android-all jars) and
      # ~/.gradle/wrapper, keyed by build files, the catalog and the wrapper; validates the wrapper.
      # Only the default branch writes the cache.
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-provider: basic
      # Auto-download is off; point Gradle at the image's JDK 21 (toolchain) and JDK 25 (daemon).
      - name: Use the image's JDKs
        run: |
          mkdir -p ~/.gradle
          echo "org.gradle.java.installations.fromEnv=JAVA_HOME_21_X64,JAVA_HOME_25_X64" >> ~/.gradle/gradle.properties
          echo "JAVA_HOME=$JAVA_HOME_25_X64" >> "$GITHUB_ENV"
      - name: Install minisign
        run: sudo apt-get install -y --no-install-recommends minisign
      # ADR 0005 "CI": install the catalog's NDK explicitly; the image's default NDK is not used.
      - name: Install the pinned NDK
        run: |
          ndk=$(sed -n 's/^android-ndk = "\(.*\)"$/\1/p' gradle/libs.versions.toml)
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$ndk" > /dev/null
          test -f "$ANDROID_HOME/ndk/$ndk/source.properties" || { echo "::error::NDK $ndk is missing"; exit 1; }
      - id: libsodium-toolchain
        run: echo "id=$(cc -dumpfullversion)" >> "$GITHUB_OUTPUT"
      - &libsodium-cache
        name: Cache the libsodium build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            meshlink-crypto-sodium/build/libsodium/download
            meshlink-crypto-sodium/build/libsodium/out
          key: libsodium-v2-${{ github.job }}-${{ steps.libsodium-toolchain.outputs.id }}-${{ hashFiles('meshlink-crypto-sodium/libsodium.properties', 'meshlink-crypto-sodium/native/build-libsodium.sh') }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: |
            libsodium-v2-${{ github.job }}-${{ steps.libsodium-toolchain.outputs.id }}-${{ hashFiles('meshlink-crypto-sodium/libsodium.properties', 'meshlink-crypto-sodium/native/build-libsodium.sh') }}-
      - run: ./gradlew buildLibsodiumAndroid buildLibsodiumHostLinux
      - run: ./gradlew check
      - run: ./gradlew dokkaGenerate

  apple:
    name: Apple (${{ matrix.phase }})
    # ADR 0017 self-hosted runner amendment: pushes, same-repository PRs and dispatches run on the
    # self-hosted Mac mini with Xcode 27.2; fork PRs never reach it and run on GitHub's macos-26 image
    # with Xcode 26.4.1. One runner runs the phases one after another.
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'macos-26' || fromJSON('["self-hosted","macOS","ARM64"]') }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        phase: [simulator, swiftpm, maven]
    env:
      DEVELOPER_DIR: ${{ github.event.pull_request.head.repo.fork && '/Applications/Xcode_26.4.1.app/Contents/Developer' || '/Applications/Xcode-27.2.0.app/Contents/Developer' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Selected Xcode
        run: |
          test -d "$DEVELOPER_DIR" || { echo "::error::$DEVELOPER_DIR is not installed"; exit 1; }
          xcodebuild -version
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-provider: basic
      # The self-hosted runner's .env provides the hosted image's JAVA_HOME_21_arm64, JAVA_HOME_25_arm64
      # and ANDROID_HOME (docs/reference/dependencies.md, "CI tools"). Its home persists between jobs,
      # so the property is written once.
      - name: Use the runner's JDKs
        run: |
          for jdk in "$JAVA_HOME_21_arm64" "$JAVA_HOME_25_arm64"; do
            test -x "$jdk/bin/java" || { echo "::error::JAVA_HOME_21_arm64 or JAVA_HOME_25_arm64 is not a JDK"; exit 1; }
          done
          mkdir -p ~/.gradle
          line="org.gradle.java.installations.fromEnv=JAVA_HOME_21_arm64,JAVA_HOME_25_arm64"
          grep -qxF "$line" ~/.gradle/gradle.properties 2>/dev/null || echo "$line" >> ~/.gradle/gradle.properties
          echo "JAVA_HOME=$JAVA_HOME_25_arm64" >> "$GITHUB_ENV"
      - name: Install minisign
        run: command -v minisign > /dev/null || brew install minisign
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
      - id: libsodium-toolchain
        run: |
          xcode=$(xcodebuild -version | tr -s '\n ' '-')
          kotlin=$(sed -n 's/^kotlin = "\(.*\)"$/\1/p' gradle/libs.versions.toml)
          test -n "$kotlin" || { echo "::error::Kotlin version is missing"; exit 1; }
          {
            echo "id=$xcode-${{ matrix.phase }}"
            echo "xcode=$xcode"
            echo "kotlin=$kotlin"
          } >> "$GITHUB_OUTPUT"
      - *libsodium-cache
      - name: Restore Kotlin/Native dependencies
        id: konan-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.konan/dependencies
          key: konan-${{ runner.os }}-${{ runner.arch }}-${{ steps.libsodium-toolchain.outputs.xcode }}-${{ steps.libsodium-toolchain.outputs.kotlin }}-${{ matrix.phase }}
          restore-keys: |
            konan-${{ runner.os }}-${{ runner.arch }}-${{ steps.libsodium-toolchain.outputs.xcode }}-${{ steps.libsodium-toolchain.outputs.kotlin }}-
      - run: ./gradlew buildLibsodiumApple buildLibsodiumHostMacos
      - if: matrix.phase == 'simulator'
        run: ./gradlew iosSimulatorArm64Test --profile
      - name: Upload iOS test profile
        if: ${{ !cancelled() && matrix.phase == 'simulator' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-test-profile-${{ matrix.phase }}
          path: |
            build/reports/profile/
            **/build/test-results/iosSimulatorArm64Test/TEST-*.xml
          if-no-files-found: error
          retention-days: 7
      - if: matrix.phase == 'swiftpm'
        run: tools/swiftpm-consumer/test.sh
        id: swiftpm_consumer
      - name: Diagnose unavailable simulators
        if: ${{ failure() && steps.swiftpm_consumer.outcome == 'failure' }}
        run: python3 tools/ci/simulator_diagnostics.py
      - if: matrix.phase == 'swiftpm'
        run: ./gradlew checkKotlinAbi checkSodiumAppleSize :meshlink:checkFrameworkSymbols
      # Ticket 65: publishing needs the iOS klibs (macOS only) and the Android libsodium build (NDK).
      - name: Install the pinned NDK
        if: matrix.phase == 'maven'
        run: |
          ndk=$(sed -n 's/^android-ndk = "\(.*\)"$/\1/p' gradle/libs.versions.toml)
          test -f "$ANDROID_HOME/ndk/$ndk/source.properties" ||
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$ndk" > /dev/null
          test -f "$ANDROID_HOME/ndk/$ndk/source.properties" || { echo "::error::NDK $ndk is missing"; exit 1; }
      - if: matrix.phase == 'maven'
        run: ./gradlew buildLibsodiumAndroid
      - if: matrix.phase == 'maven'
        run: tools/maven-consumer/test.sh
      - name: Save Kotlin/Native dependencies
        if: github.ref == 'refs/heads/main' && steps.konan-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.konan/dependencies
          key: konan-${{ runner.os }}-${{ runner.arch }}-${{ steps.libsodium-toolchain.outputs.xcode }}-${{ steps.libsodium-toolchain.outputs.kotlin }}-${{ matrix.phase }}

  macos:
    name: iOS simulator tests and SwiftPM consumer (macOS)
    if: always()
    needs: [apple]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require all Apple phases
        run: test "$APPLE_RESULT" = success || { echo "::error::Apple phases did not all succeed"; exit 1; }
        env:
          APPLE_RESULT: ${{ needs.apple.result }}
