# Large seeded density meshes (ticket 42; ADR 0017 decisions 11 and 12). Scheduled and not a
# required check. The warm job resolves the dependencies and builds libsodium once and saves both
# caches, so 40 cold jobs never hit Maven Central at once (HTTP 429). One job per cell and seed then
# records that seed's run without checking bands (a 200-node seed takes 20-41 min on a hosted
# runner); the pool job pools each cell's seeds,
# fails on any band a pooled cell misses, writes the run summary and uploads density-report.
name: Density

on:
  schedule:
    - cron: "41 3 * * 6" # weekly, Saturday 03:41 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: density-${{ github.ref }}
  cancel-in-progress: true

jobs:
  warm:
    name: Density dependencies (scheduled, not required)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - &checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The only job that saves the Gradle cache, also on a branch (where setup-gradle defaults to read-only).
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-provider: basic
          cache-read-only: false
      # Auto-download is off; point Gradle at the image's JDK 21 (toolchain) and JDK 25 (daemon).
      - &jdks
        name: Use the image's JDKs
        run: |
          mkdir -p ~/.gradle
          echo "org.gradle.java.installations.fromEnv=JAVA_HOME_21_X64,JAVA_HOME_25_X64" >> ~/.gradle/gradle.properties
          echo "JAVA_HOME=$JAVA_HOME_25_X64" >> "$GITHUB_ENV"
      # The cells load libsodium through the host JNI shim, which verifies the tarball with minisign.
      - &minisign
        name: Install minisign
        run: sudo apt-get install -y --no-install-recommends minisign
      - &libsodium-toolchain
        id: libsodium-toolchain
        run: echo "id=$(cc -dumpfullversion)" >> "$GITHUB_OUTPUT"
      # One key for every job here (same image and compiler): the warm job builds, the rest restore.
      - &libsodium-cache
        name: Cache the libsodium build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            meshlink-crypto-sodium/build/libsodium/download
            meshlink-crypto-sodium/build/libsodium/out
          key: libsodium-v2-density-${{ steps.libsodium-toolchain.outputs.id }}-${{ hashFiles('meshlink-crypto-sodium/libsodium.properties', 'meshlink-crypto-sodium/native/build-libsodium.sh') }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: |
            libsodium-v2-density-${{ steps.libsodium-toolchain.outputs.id }}-${{ hashFiles('meshlink-crypto-sodium/libsodium.properties', 'meshlink-crypto-sodium/native/build-libsodium.sh') }}-
      - run: ./gradlew :meshlink-testing:compileAndroidHostTest :meshlink-crypto-sodium:buildLibsodiumLinuxX8664

  seed:
    name: Density ${{ matrix.cell }} seed ${{ matrix.seed }} (scheduled, not required)
    needs: warm
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # The 200-node cells first: about 20 jobs run at once and they take longest.
        cell: [n200-low, n200-medium, n200-high, n100-low, n100-medium, n100-high, n50-low, n50-medium]
        seed: [1, 2, 3, 4, 5]
    steps:
      - *checkout
      - &setup-gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-provider: basic
          cache-read-only: true
      - *jdks
      - *minisign
      - *libsodium-toolchain
      - *libsodium-cache
      - run: >-
          ./gradlew :meshlink-testing:densityTest -Pdensity.measureOnly=true
          -Pdensity.cells=${{ matrix.cell }} -Pdensity.seeds=${{ matrix.seed }}
      - name: Upload the seed run
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: density-${{ matrix.cell }}-seed${{ matrix.seed }}
          path: meshlink-testing/build/density/${{ matrix.cell }}-seed${{ matrix.seed }}.run
          if-no-files-found: error

  pool:
    name: Density bands (scheduled, not required)
    needs: seed
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - *checkout
      - *setup-gradle
      - *jdks
      - *minisign
      - *libsodium-toolchain
      - *libsodium-cache
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: density-*-seed*
          path: density-runs
      - run: ./gradlew :meshlink-testing:densityTest -Pdensity.pool=density-runs
      - name: Summarize the cells
        if: always()
        run: |
          {
            echo "| Cell | Unicast low | medium | high | Broadcast low | medium | high | Idle control | Busiest B/s | Wall | Verdict |"
            echo "|---|---|---|---|---|---|---|---|---|---|---|"
            cat meshlink-testing/build/density/*.md 2>/dev/null || echo "| all | no result | | | | | | | | | **fail** |"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload the pooled report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: density-report
          path: meshlink-testing/build/density/
          if-no-files-found: ignore
      # A seed job that crashed or timed out leaves its cell pooled over fewer seeds: fail the run.
      - name: Require every seed
        if: ${{ needs.seed.result != 'success' }}
        run: |
          echo "::error::A seed job did not succeed (${{ needs.seed.result }}); its cell pooled fewer seeds."
          exit 1
