# typos config (ADR 0006, decision 10): docs use US English.
[default]
locale = "en-us"

[files]
# Generated evidence data (CSV columns, rendered HTML reports, raw runs, generated summary tables) is not prose.
extend-exclude = [
  "docs/evidence/**/*.csv",
  "docs/evidence/**/*.html",
  "docs/evidence/**/raw/**",
  "docs/evidence/**/summary/**",
]

[default.extend-words]
# Apple's unique device identifier.
udid = "udid"
# Huawei model code (nova 9, NAM-LX9).
NAM = "NAM"
