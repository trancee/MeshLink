name: BakeoffHost
options:
  deploymentTarget:
    iOS: "15.0"
settings:
  base:
    LAB_BUNDLE_ID: ch.trancee.lab.host
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    ENABLE_BITCODE: NO
    TARGETED_DEVICE_FAMILY: "1"
    FRAMEWORK_SEARCH_PATHS: $(SRCROOT)/../shared/build/bin/iosArm64/releaseFramework
    OTHER_LDFLAGS: ["-framework", "Bakeoff"]
    ARCHS: arm64
targets:
  BakeoffHost:
    type: application
    platform: iOS
    sources: [Sources, Shared]
    dependencies:
      - target: BakeoffLiveActivity
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(LAB_BUNDLE_ID)
    scheme:
      testTargets: [BakeoffGrantUITests]
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: Bakeoff
        CFBundleShortVersionString: "0.1"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSBluetoothAlwaysUsageDescription: MeshLink bearer bake-off prototype measures BLE links between test phones.
        UIFileSharingEnabled: true
        UIBackgroundModes: [bluetooth-central, bluetooth-peripheral]
        LSSupportsOpeningDocumentsInPlace: true
        NSSupportsLiveActivities: true
  # T4 (lab only): Live Activity widget extension.
  BakeoffLiveActivity:
    type: app-extension
    platform: iOS
    deploymentTarget: "16.1"
    sources: [LiveActivity, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(LAB_BUNDLE_ID).live
        OTHER_LDFLAGS: []
        FRAMEWORK_SEARCH_PATHS: []
    info:
      path: LiveActivity/Info.plist
      properties:
        CFBundleDisplayName: BakeoffLive
        CFBundleShortVersionString: "0.1"
        CFBundleVersion: "1"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
  # UI-test runner that accepts the Bluetooth permission alert (exact labels only); see GrantBluetoothTests.swift.
  BakeoffGrantUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: BakeoffHost
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(LAB_BUNDLE_ID).grant
        TEST_TARGET_NAME: BakeoffHost
        GENERATE_INFOPLIST_FILE: YES
        OTHER_LDFLAGS: []
        FRAMEWORK_SEARCH_PATHS: []
